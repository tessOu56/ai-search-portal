name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      target_ref:
        description: "Git ref to deploy (branch/tag/sha)"
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event_name == 'push' && 'production' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'production' || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
    env:
      # push to main → production；workflow_dispatch → 依 inputs
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.target_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI and contracts
        run: |
          pnpm run lint:openapi
          pnpm run verify:openapi-codegen

      - name: Pull Vercel environment
        run: npx --yes vercel pull --yes --environment=${{ env.DEPLOY_ENV }} --token=${{ env.VERCEL_TOKEN }}

      - name: Build Vercel output
        run: npx --yes vercel build --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy preview
        if: ${{ env.DEPLOY_ENV == 'preview' }}
        id: deploy_preview
        shell: bash
        run: |
          URL="$(npx --yes vercel deploy --prebuilt --token=${{ env.VERCEL_TOKEN }})"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        if: ${{ env.DEPLOY_ENV == 'production' }}
        id: deploy_production
        shell: bash
        run: |
          URL="$(npx --yes vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }})"
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        shell: bash
        run: |
          echo "## Vercel Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ env.DEPLOY_ENV }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.event_name == 'push' && github.sha || inputs.target_ref }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ env.DEPLOY_ENV }}" = "preview" ]; then
            echo "- URL: ${{ steps.deploy_preview.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- URL: ${{ steps.deploy_production.outputs.production_url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
