name: Deploy to Vercel

on:
  # main 的 CI 成功後自動部署 production
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      target_ref:
        description: "Git ref to deploy (branch/tag/sha)"
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
    # workflow_run 只在 CI 成功時放行；手動觸發不受限
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
    env:
      # CI 成功後的 workflow_run → production；workflow_dispatch → 依 inputs
      DEPLOY_ENV: ${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Fail fast on missing secrets
        shell: bash
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"
              missing=1
            fi
          done
          exit $missing

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI and contracts
        run: |
          pnpm run lint:openapi
          pnpm run verify:openapi-codegen

      - name: Pull Vercel environment
        run: npx --yes vercel@54.19.0 pull --yes --environment=${{ env.DEPLOY_ENV }} --token=${{ env.VERCEL_TOKEN }}

      - name: Build Vercel output
        run: npx --yes vercel@54.19.0 build --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy preview
        if: ${{ env.DEPLOY_ENV == 'preview' }}
        id: deploy_preview
        shell: bash
        run: |
          URL="$(npx --yes vercel@54.19.0 deploy --prebuilt --token=${{ env.VERCEL_TOKEN }})"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        if: ${{ env.DEPLOY_ENV == 'production' }}
        id: deploy_production
        shell: bash
        run: |
          URL="$(npx --yes vercel@54.19.0 deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }})"
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        shell: bash
        run: |
          echo "## Vercel Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ env.DEPLOY_ENV }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_ref }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ env.DEPLOY_ENV }}" = "preview" ]; then
            echo "- URL: ${{ steps.deploy_preview.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- URL: ${{ steps.deploy_production.outputs.production_url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
