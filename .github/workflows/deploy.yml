# 注意：本專案正式部署為 Vercel（見 vercel.json）。
# 此 workflow 僅做建置驗證（push 到 main 時跑 build）；不部署 GitHub Pages。
name: Build (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (CI Gate)
        run: npm run lint:strict
        continue-on-error: false

      - name: Run TypeScript type check
        run: npm run typecheck
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production


