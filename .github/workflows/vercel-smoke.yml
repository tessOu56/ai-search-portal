# Fail when the deployed portal is not serving `/` and main routes as 200.
# Catches platform NOT_FOUND (Remix Framework Preset vs React Router output).
#
# Two jobs:
# - `smoke`: the hashed deployment URL from deployment_status. Previews sit
#   behind Vercel Authentication, so SSO there is SKIP (app unobservable).
# - `production-alias`: the public production URL in strict mode. SSO, 404,
#   wrong body or unreachable all FAIL. Runs after every Production deployment,
#   daily, and on demand, so a broken alias can no longer hide behind a green
#   SSO-skipped hashed URL.
name: Vercel smoke

on:
  deployment_status:
  schedule:
    - cron: "17 1 * * *" # 09:17 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke deployed URL
    if: >
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.target_url, 'vercel.app')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Smoke `/` and main routes
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: node scripts/prod-smoke.mjs "$TARGET_URL"

  production-alias:
    name: Smoke production URL (strict)
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Smoke https://ai-search-portal.vercel.app
        shell: bash
        run: |
          # The alias can lag the deployment by a few seconds; retry before failing.
          for attempt in 1 2 3; do
            if node scripts/prod-smoke.mjs --strict "https://ai-search-portal.vercel.app"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::Production URL https://ai-search-portal.vercel.app is not serving the portal (see FAIL lines above)."
          exit 1
