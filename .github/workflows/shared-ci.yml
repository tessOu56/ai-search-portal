# Shared node/audit/smoke + deps-track guard (tessOu56/renovate-config)
name: Shared CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-node:
    uses: tessOu56/renovate-config/.github/workflows/ci-node.yml@525ac1d7642244a303c2b26bf3bcdfe683e684c5 # main
    with:
      command: pnpm test
      audit: true
      audit-level: high

  deps-track-guard:
    uses: tessOu56/renovate-config/.github/workflows/deps-track-guard.yml@525ac1d7642244a303c2b26bf3bcdfe683e684c5 # main
