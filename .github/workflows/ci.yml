# CI：build / test / lint 皆通過才放行；失敗時產出說明報告並上傳 Artifacts
# 可重現性來自 pnpm-lock.yaml + pnpm install --frozen-lockfile；setup-node 的 pnpm cache 僅加速安裝，非真理來源。
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # Reproducibility: pnpm-lock.yaml + --frozen-lockfile. Cache above speeds install only.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Build
        run: pnpm run build

      - name: Build API (backend)
        run: pnpm run build:api

      - name: Test
        run: pnpm run test && pnpm run test:api && pnpm run test:labs
        env:
          CI: true

      - name: Offline eval
        run: pnpm run eval:offline

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: eval-reports
          path: |
            reports/eval-*.json
            reports/eval-*.xml
          if-no-files-found: ignore

      - name: Publish Test Results (JUnit)
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Vitest Results
          path: reports/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: ESLint report (for failure summary)
        run: pnpm run lint:report
        continue-on-error: true

      - name: Lint & typecheck
        run: |
          pnpm run lint:filenames
          pnpm run lint:handlers
          pnpm run lint:openapi
          pnpm run verify:openapi-codegen
          pnpm exec eslint --max-warnings=0 --cache --cache-location ./node_modules/.cache/eslint --report-unused-disable-directives . -f gha
          pnpm run typecheck

      - name: Code review TODO list
        run: pnpm run code-review:list
        continue-on-error: true

      - name: Generate CI failure report
        if: failure()
        run: |
          node scripts/ci-failure-report.mjs > reports/ci-failure-summary.md 2>&1 || true
          if [ -f reports/ci-failure-summary.md ]; then
            echo "## CI 失敗說明" >> "$GITHUB_STEP_SUMMARY"
            cat reports/ci-failure-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-reports
          path: reports/
          retention-days: 7

  knip:
    name: Unused Code Check (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run knip
