# VitePress docs → GitHub Pages (project site base /ai-search-portal/)
# 純 shell 部署：不依賴 actions/*、pnpm/*（repo 若設「僅允許 tessOu56 actions」仍可跑）。
# Pages 設定：Settings → Pages → Deploy from a branch → gh-pages / root（非 GitHub Actions 來源）。
# Vercel：gh-pages 產物會寫入 ignore-all vercel.json，避免 Git 整合把 docs 當 Remix 建置（2026-07-23）。
name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs-ghp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Setup Node 22 and pnpm
        run: |
          NODE_VERSION=22.16.0
          NODE_DIR="/tmp/node-v${NODE_VERSION}-linux-x64"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /tmp
          echo "${NODE_DIR}/bin" >> "$GITHUB_PATH"
          export PATH="${NODE_DIR}/bin:$PATH"
          node --version
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Build docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs:build

      - name: Push gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST=docs/.vitepress/dist
          test -f "$DIST/index.html"
          cd "$DIST"
          touch .nojekyll
          # gh-pages has no app vercel.json; without this, Vercel Git integration
          # tries to build the static docs tree as Remix and ERROR-spams the project.
          cat > vercel.json <<'EOF'
          {
            "git": { "deploymentEnabled": false },
            "ignoreCommand": "echo 'gh-pages is GitHub Pages only — skip Vercel'; exit 0"
          }
          EOF
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
