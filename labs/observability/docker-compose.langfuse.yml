# Optional Langfuse stack for local dev (Sprint 3).
# Upstream image versions change — pin after first successful `docker compose up`.
name: ai-search-portal-langfuse

services:
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    ports:
      - "5433:5432"
    volumes:
      - langfuse_pg:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      - langfuse-db
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: change-me-local-only
      SALT: change-me-local-only
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_pg:
