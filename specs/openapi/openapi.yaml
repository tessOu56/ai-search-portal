openapi: 3.0.3
info:
  title: AI Search Portal HTTP API
  version: 0.3.0
  description: >
    Items CRUD and Metadata catalog APIs. Must stay aligned with @ai-search-portal/contracts (Zod).

servers:
  - url: /
    description: Relative to deployment origin

paths:
  /api/items:
    get:
      operationId: listItems
      summary: List items
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemsResponse"
    post:
      operationId: createItem
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetItemResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      summary: Get item by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetItemResponse"
        "400":
          description: Missing id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateItemPut
      summary: Update item (PUT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetItemResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateItemPatch
      summary: Update item (PATCH)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetItemResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItem
      summary: Delete item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetItemResponse"
        "400":
          description: Missing id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/metadata:
    get:
      operationId: listMetadata
      summary: List metadata assets
      parameters:
        - name: pack
          in: query
          schema:
            type: string
          description: Context pack id (default enterprise-mau)
        - name: q
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMetadataResponse"

  /api/context/packs:
    get:
      operationId: listContextPacks
      summary: List available context packs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContextPacksResponse"

  /api/context/metrics/{metricId}:
    parameters:
      - name: metricId
        in: path
        required: true
        schema:
          type: string
      - name: pack
        in: query
        schema:
          type: string
    get:
      operationId: getContextMetric
      summary: Get context metric definition
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetContextMetricResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/context/bindings:
    get:
      operationId: getContextBindings
      summary: Resolve domain bindings for a context pack
      parameters:
        - name: pack
          in: query
          schema:
            type: string
        - name: ref
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetContextBindingsResponse"

  /api/metadata/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMetadataAsset
      summary: Get metadata asset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMetadataAssetResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/metadata/access-requests/evaluate:
    post:
      operationId: evaluateMetadataAccess
      summary: Evaluate access policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataAccessEvaluateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateAccessResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/metadata/access-requests:
    get:
      operationId: listMetadataAccessRequests
      summary: List access applications
      parameters:
        - name: requesterId
          in: query
          required: false
          schema:
            type: string
        - name: pendingOnly
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccessApplicationsResponse"
    post:
      operationId: submitMetadataAccess
      summary: Submit metadata access request
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataAccessRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitAccessResponse"
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitAccessResponse"
        "403":
          description: Access denied by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"
        "422":
          description: HITL approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"

  /api/metadata/access-requests/{requestId}/review:
    post:
      operationId: reviewMetadataAccess
      summary: Approve, deny, or edit a pending access request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAccessRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"
        "409":
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"

  /api/metadata/access-requests/{requestId}/submit:
    post:
      operationId: submitDraftMetadataAccess
      summary: Promote draft application to pending_approval
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDraftAccessRequest"
      responses:
        "202":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitAccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"
        "409":
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"

  /api/metadata/access-requests/{requestId}/cancel:
    post:
      operationId: cancelMetadataAccess
      summary: Cancel a draft or pending access request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAccessRequest"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelAccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"
        "409":
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyError"

  /api/metadata/{assetId}/lineage:
    get:
      operationId: getMetadataLineage
      summary: Resolve upstream/downstream lineage for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: pack
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataLineageResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/audit:
    get:
      operationId: listAuditEvents
      summary: List recent audit events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditEventsResponse"

components:
  schemas:
    MockItem:
      type: object
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string

    ListItemsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MockItem"

    GetItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MockItem"

    CreateItemRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true

    UpdateItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    GovernancePolicyError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            [
              ACCESS_DENIED,
              HITL_REQUIRED,
              INVALID_TRANSITION,
              NOT_FOUND,
              VALIDATION_ERROR,
            ]
        decision:
          $ref: "#/components/schemas/PolicyDecision"
        toolError:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [HITL_REQUIRED]
            message:
              type: string
            tool:
              type: string
            riskLevel:
              type: string
              enum: [low, medium, high]

    MetadataAssetSummary:
      type: object
      required:
        [id, name, description, assetType, owner, tags, classification, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        assetType:
          type: string
          enum: [Database, Table, API, Dashboard]
        owner:
          type: string
        tags:
          type: array
          items:
            type: string
        classification:
          type: string
          enum: [public, internal, PII, confidential]
        updatedAt:
          type: string
        fqn:
          type: string
        facets:
          $ref: "#/components/schemas/DomainFacets"

    MonetaryAmount:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
          description: ISO 4217 code, e.g. TWD.
          minLength: 3
          maxLength: 3
        per:
          type: string
          description: "Pricing basis: kg, g, session, half_day, unit."

    RegionRef:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable region code, e.g. TW-TPE, TW-NORTH.
        label:
          type: string
        level:
          type: string
          enum: [country, region, city, district, market]

    TimeWindow:
      type: object
      required: [start]
      properties:
        start:
          type: string
          description: ISO 8601.
        end:
          type: string
          description: ISO 8601; absent means open-ended.
        timezone:
          type: string
          description: IANA zone, e.g. Asia/Taipei.
        recurrence:
          type: string
          description: "Recurrence hint, e.g. seasonal:JUL-SEP, weekly:SAT."

    DomainFacets:
      type: object
      description: Optional money/time/region facet bundle on metadata assets.
      properties:
        domain:
          type: string
          description: Domain key, e.g. agri, metalcraft.
        pricing:
          $ref: "#/components/schemas/MonetaryAmount"
        region:
          $ref: "#/components/schemas/RegionRef"
        timeWindow:
          $ref: "#/components/schemas/TimeWindow"
        completeness:
          type: string
          enum: [complete, partial, minimal]
          description: Modeled completeness signal for partial-but-reasonable data.

    MetricValue:
      type: object
      required: [value, asOf]
      properties:
        value:
          type: number
        unit:
          type: string
          description: Display unit, e.g. TWD/kg, days, "%".
        asOf:
          type: string
          description: ISO 8601 timestamp of the reading.
        region:
          $ref: "#/components/schemas/RegionRef"

    ListMetadataResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MetadataAssetSummary"
        pagination:
          type: object
          required: [page, pageSize, total, totalPages]
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    MetadataAssetDetail:
      allOf:
        - $ref: "#/components/schemas/MetadataAssetSummary"
        - type: object
          required: [fqn, upstreamIds, downstreamIds]
          properties:
            fqn:
              type: string
            upstreamIds:
              type: array
              items:
                type: string
            downstreamIds:
              type: array
              items:
                type: string

    GetMetadataAssetResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MetadataAssetDetail"

    MetadataAccessEvaluateRequest:
      type: object
      required: [assetId, purpose]
      properties:
        assetId:
          type: string
        purpose:
          type: string
          enum: [analytics, marketing, operations]
        role:
          type: string
          enum: [analyst, data_admin, engineer]

    MetadataAccessRequest:
      allOf:
        - $ref: "#/components/schemas/MetadataAccessEvaluateRequest"
        - type: object
          properties:
            approved:
              type: boolean
            requesterId:
              type: string
            asDraft:
              type: boolean

    PolicyDecision:
      type: object
      required:
        [allow, need_approval, mask_fields, require_audit, decision_id, reasons]
      properties:
        allow:
          type: boolean
        need_approval:
          type: boolean
        mask_fields:
          type: array
          items:
            type: string
        require_audit:
          type: boolean
        decision_id:
          type: string
        reasons:
          type: array
          items:
            type: string

    EvaluateAccessResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PolicyDecision"

    SubmitAccessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [requestId, status, decision, auditLogged]
          properties:
            requestId:
              type: string
            status:
              type: string
              enum:
                [
                  draft,
                  pending_approval,
                  approved,
                  denied,
                  expired,
                  cancelled,
                ]
            decision:
              $ref: "#/components/schemas/PolicyDecision"
            auditLogged:
              type: boolean

    AccessApplication:
      type: object
      required:
        [
          id,
          assetId,
          assetName,
          purpose,
          role,
          requesterId,
          status,
          permissionStatus,
          owner,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        assetId:
          type: string
        assetName:
          type: string
        purpose:
          type: string
          enum: [analytics, marketing, operations]
        role:
          type: string
          enum: [analyst, data_admin, engineer]
        requesterId:
          type: string
        status:
          type: string
          enum:
            [
              draft,
              pending_approval,
              approved,
              denied,
              expired,
              cancelled,
            ]
        permissionStatus:
          type: string
          enum: [none, pending, granted, revoked]
        owner:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        decision:
          $ref: "#/components/schemas/PolicyDecision"
        termsAccepted:
          type: array
          items:
            type: string

    ListAccessApplicationsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AccessApplication"

    ReviewAccessRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, denied, edited]
        reviewerId:
          type: string
        purpose:
          type: string
          enum: [analytics, marketing, operations]
        role:
          type: string
          enum: [analyst, data_admin, engineer]

    ReviewAccessResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccessApplication"

    SubmitDraftAccessRequest:
      type: object
      properties:
        approved:
          type: boolean

    CancelAccessRequest:
      type: object
      properties:
        reason:
          type: string

    CancelAccessResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccessApplication"

    MetadataLineageNode:
      type: object
      required: [id, label, type]
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [table, column, api, dashboard, database]

    MetadataLineageEdge:
      type: object
      required: [source, target]
      properties:
        source:
          type: string
        target:
          type: string

    MetadataLineageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [assetId, upstream, downstream, nodes, edges]
          properties:
            assetId:
              type: string
            upstream:
              type: array
              items:
                $ref: "#/components/schemas/MetadataAssetSummary"
            downstream:
              type: array
              items:
                $ref: "#/components/schemas/MetadataAssetSummary"
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/MetadataLineageNode"
            edges:
              type: array
              items:
                $ref: "#/components/schemas/MetadataLineageEdge"

    ContextPackManifest:
      type: object
      required: [id, name, description, defaultLocale]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        defaultLocale:
          type: string

    ListContextPacksResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ContextPackManifest"

    ContextMetric:
      type: object
      required:
        [id, definition, owner, sourceAssetId, accessPolicy]
      properties:
        id:
          type: string
        definition:
          type: string
        owner:
          type: string
        sourceAssetId:
          type: string
        upstreamJobIds:
          type: array
          items:
            type: string
        downstreamDashboardIds:
          type: array
          items:
            type: string
        qualityRules:
          type: array
          items:
            type: string
        accessPolicy:
          type: string
        recentChanges:
          type: array
          items:
            type: object
            required: [date, change]
            properties:
              date:
                type: string
              change:
                type: string
        valueType:
          type: string
          enum: [money, duration, count, ratio, score]
        latestValue:
          $ref: "#/components/schemas/MetricValue"

    GetContextMetricResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ContextMetric"

    ResolvedDomainBinding:
      type: object
      required: [contextRef, module, entityId, relation, resolved]
      properties:
        contextRef:
          type: string
        module:
          type: string
        entityId:
          type: string
        relation:
          type: string
        resolved:
          type: boolean
        entityName:
          type: string

    GetContextBindingsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedDomainBinding"

    AuditEvent:
      type: object
      required:
        [id, at, action, actor, resource, decisionId, outcome, requireAudit, reasons]
      properties:
        id:
          type: string
          minLength: 1
        at:
          type: string
          description: ISO 8601 timestamp
        action:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
        actor:
          type: object
          required: [role]
          properties:
            role:
              type: string
              enum: [analyst, data_admin, engineer]
        resource:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              minLength: 1
            id:
              type: string
              minLength: 1
        decisionId:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
        outcome:
